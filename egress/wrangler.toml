# Binance egress for liveira-shop. Binance answers HTTP 451 (restricted location) when the main Worker runs in a US
# data center (e.g. requests that enter via IAD). This tiny Worker is pinned near Binance's API region with a placement
# hint and is reachable ONLY through the service binding BINANCE_EGRESS of liveira-shop (no workers.dev URL, no routes).
# It stores no secrets: the main Worker signs each request and passes its API key header through.
# Deploy (needs wrangler >= 4 for placement.region):
#   CLOUDFLARE_API_TOKEN=... CLOUDFLARE_ACCOUNT_ID=... npx -y wrangler@4 deploy -c egress/wrangler.toml
name = "liveira-shop-binance-egress"
main = "index.js"
compatibility_date = "2024-09-23"
workers_dev = false
preview_urls = false

[placement]
region = "aws:ap-northeast-1"
