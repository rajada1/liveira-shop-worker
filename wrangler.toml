name = "liveira-shop"
main = "src/index.js"
compatibility_date = "2024-09-23"

# Every minute: re-check pending Binance Pay claims (no Binance request when nothing is pending).
[triggers]
crons = ["* * * * *"]

[[d1_databases]]
binding = "DB"
database_name = "liveira-shop"
database_id = "b4c7c78f-4e79-4587-a559-6f794c607bfc"

[[r2_buckets]]
binding = "FILES"
bucket_name = "liveira-shop-files"

[[r2_buckets]]
binding = "CHASE_FILES"
bucket_name = "cf-chase-files"

[[rules]]
type = "Text"
globs = ["**/*.html", "**/*.txt"]
fallthrough = true

# Binance requests leave through liveira-shop-binance-egress (egress/), pinned near Binance's API region, because
# Binance answers HTTP 451 to Cloudflare data centers in restricted countries (e.g. US). Deploy egress/ first.
[[services]]
binding = "BINANCE_EGRESS"
service = "liveira-shop-binance-egress"

[vars]
# Binance Pay desativado no Shop (2026-10-05): a conta Binance agora é verificada automaticamente só pelo @LiveiraStore_bot.
# "1" = opção oculta + cron/verificação parados (código mantido). Ver DEPLOY_NOTES.md.
BINANCE_DISABLED = "1"
